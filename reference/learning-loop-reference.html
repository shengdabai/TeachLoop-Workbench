<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TeachLoop 学习循环速查</title>
    <style>
      body { margin: 0; padding: 32px; color: #1c2420; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; background: #fffdf8; }
      main { max-width: 920px; margin: 0 auto; }
      h1 { font-size: 36px; line-height: 1.1; }
      section { border-top: 1px solid #d6d0c5; padding: 20px 0; }
      code { background: #f4f1ea; padding: 2px 5px; border-radius: 4px; }
      @media print { body { padding: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>TeachLoop 学习循环速查</h1>
      <section>
        <h2>闭环</h2>
        <p>Mission → Trusted resources → Tiny lesson → Retrieval practice → Real output → Learning record.</p>
      </section>
      <section>
        <h2>好学习任务</h2>
        <ul>
          <li>服务一个真实用途，而不是抽象兴趣。</li>
          <li>15-60 分钟能完成。</li>
          <li>结束时留下可检查证据。</li>
          <li>包含闭卷回忆或真实操作。</li>
        </ul>
      </section>
      <section>
        <h2>工作区文件</h2>
        <p><code>MISSION.md</code> 定方向，<code>RESOURCES.md</code> 管来源，<code>lessons/</code> 存单课，<code>reference/</code> 存速查，<code>learning-records/</code> 存真正学会的东西。</p>
      </section>
    </main>
  </body>
</html>
